<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Markdown Image Link Generator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --panel: #fff;
      --ink: #172033;
      --muted: #687386;
      --line: #e1e6ef;
      --accent: #5268e8;
      --accent-hover: #4054ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top left, #e9edff, transparent 42%), var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 640px); padding: clamp(24px, 5vw, 42px);
      background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 18px 55px rgba(30, 43, 75, .09);
    }
    .mark {
      display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 22px;
      border-radius: 14px; background: #eef0ff; color: var(--accent);
      font-size: 24px; font-weight: 700;
    }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.15rem); letter-spacing: -.04em; }
    .intro { margin: 9px 0 28px; color: var(--muted); }
    .field { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; font-size: .9rem; font-weight: 650; }
    input {
      display: block; width: 100%; min-width: 0; padding: 14px 15px;
      border: 1px solid var(--line); border-radius: 11px; outline: none;
      font: inherit; color: var(--ink); background: #fff;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(82,104,232,.13); }
    .actions { display: flex; gap: 10px; }
    button {
      border: 0; border-radius: 11px; padding: 12px 19px;
      background: var(--accent); color: #fff; font: inherit;
      font-weight: 650; cursor: pointer; transition: background .15s, transform .15s;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .result { margin-top: 27px; }
    .result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
    .result-head label { margin: 0; }
    .copy { padding: 8px 13px; font-size: .85rem; }
    textarea {
      display: block; width: 100%; min-height: 82px; resize: vertical; padding: 14px;
      border: 1px solid var(--line); border-radius: 11px; background: #f8f9fc;
      color: #263149; font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .hint, .status { margin: 9px 0 0; color: var(--muted); font-size: .84rem; }
    .status { min-height: 1.3em; color: #26734d; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    @media (max-width: 520px) {
      .actions { flex-direction: column; }
      .actions button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>Markdown Image Link</h1>
    <p class="intro">Enter an image URL and an optional title to generate Markdown.</p>

    <form id="converter">
      <div class="field">
        <label for="url">Image URL</label>
        <input id="url" type="url" placeholder="https://example.com/image.jpg"
               required autocomplete="url">
      </div>

      <div class="field">
        <label for="title">Image title / alt text <span style="font-weight:400;color:#687386">(optional)</span></label>
        <input id="title" type="text" placeholder="Describe the image">
      </div>

      <div class="actions">
        <button type="submit">Generate Markdown</button>
      </div>
    </form>

    <section class="result" aria-live="polite">
      <div class="result-head">
        <label for="markdown">Markdown output</label>
        <button class="copy" id="copy" type="button" disabled>Copy</button>
      </div>
      <textarea id="markdown" readonly placeholder="Your Markdown will appear here..."
                spellcheck="false"></textarea>
      <p class="hint">Format: <code>![Image title](image-url)</code></p>
      <p class="status" id="status" role="status"></p>
    </section>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("converter");
    const urlInput = document.getElementById("url");
    const titleInput = document.getElementById("title");
    const output = document.getElementById("markdown");
    const copyButton = document.getElementById("copy");
    const status = document.getElementById("status");

    function escapeMarkdownAltText(value) {
      return value
        .replace(/\\/g, "\\\\")
        .replace(/\[/g, "\\[")
        .replace(/\]/g, "\\]");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      try {
        const parsedUrl = new URL(urlInput.value.trim());
        if (parsedUrl.protocol !== "http:" && parsedUrl.protocol !== "https:") {
          throw new Error("Invalid protocol");
        }

        const title = escapeMarkdownAltText(titleInput.value.trim());
        output.value = `![${title}](${parsedUrl.href})`;
        copyButton.disabled = false;
        status.textContent = "Markdown generated.";
      } catch {
        output.value = "";
        copyButton.disabled = true;
        status.textContent = "Enter a valid http:// or https:// image URL.";
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "Copied to clipboard.";
      } catch {
        output.focus();
        output.select();
        status.textContent = "Select the text above and copy it.";
      }
    });

    // Update the output if the title changes after a URL has been generated.
    titleInput.addEventListener("input", () => {
      if (!output.value) return;
      try {
        const parsedUrl = new URL(urlInput.value.trim());
        const title = escapeMarkdownAltText(titleInput.value.trim());
        output.value = `![${title}](${parsedUrl.href})`;
      } catch {
        // Leave the current output unchanged if the URL is invalid.
      }
    });
  </script>
</body>
</html>
